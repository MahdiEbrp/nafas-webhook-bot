name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      # Offline: OpenRouter and Telegram are faked, so no secrets are needed.
      - name: Self-test
        run: npm run selftest
      # lib/users is held at 100% on every metric. It is the one module where a
      # silent gap is expensive: it changes user data, and the guarantee that
      # nothing is sent before a confirmation is exactly the kind of thing a
      # missing test lets rot.
      - name: Coverage (lib/users at 100%)
        run: npm run coverage
      - name: Build
        run: npm run build
        env:
          OPENROUTER_API_KEY: build-time-placeholder
